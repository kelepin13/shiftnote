name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        description: "Run the evaluation suite against a real provider (needs SHIFTNOTE_API_KEY secret)"
        type: choice
        options: [openai, anthropic, gemini]
        default: openai

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Evaluation smoke test (offline mock)
        run: python -m shiftnote.evals --min-vitals-recall 0.8

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shiftnote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual: Actions tab -> CI -> Run workflow. Uploads the markdown report as an artifact.
  evals-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m shiftnote.evals --out evals/report-${{ inputs.provider }}.md
        env:
          SHIFTNOTE_PROVIDER: ${{ inputs.provider }}
          SHIFTNOTE_API_KEY: ${{ secrets.SHIFTNOTE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.provider }}
          path: evals/report-${{ inputs.provider }}.md
